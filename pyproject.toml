[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sinustdd"
dynamic = ["version"]
description = "Sinusoidal TDD Harmonic State Machine for Autonomous Coding Agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Franklin Silveira Baldo", email = "franklinbaldo@gmail.com" },
]
dependencies = [
    "pydantic>=2.7",
    "cyclopts>=4.0",
    "fastmcp>=3.0",
    "rich>=13.0",
    "okf-parser>=0.45.6",
    "duckdb>=1.4,<2",
    "PyYAML>=6,<7",
]

[project.scripts]
sinustdd = "sinustdd.cli:app"

[project.urls]
Homepage = "https://github.com/franklinbaldo/sinustdd"
Repository = "https://github.com/franklinbaldo/sinustdd"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "prek>=0.5.1",
    "ty>=0.0.1a0",
    "bandit>=1.8",
    "vulture>=2.14",
]

[tool.hatch.version]
path = "src/sinustdd/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sinustdd"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B404", "B603", "B607", "B110"]

[tool.vulture]
paths = ["src/sinustdd"]
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sinustdd --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["src/sinustdd"]

[tool.coverage.report]
show_missing = true
fail_under = 80
