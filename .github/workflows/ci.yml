name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint (Ruff check)
        run: uv run ruff check .

      - name: Format (Ruff format)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check

      - name: Security audit (Bandit)
        run: uv run bandit -r src/ -c pyproject.toml

      - name: Dead code check (Vulture)
        run: uv run vulture src/ --min-confidence 80

      - name: Validate PEP 723 Metadata in scripts
        run: uv run scripts/check_pep723.py

      - name: Check Version Sync & Changelog Presence
        run: uv run scripts/check_version.py

      - name: Run Pytest
        run: uv run pytest -v

      - name: SinusTDD causal completion gate
        if: github.event_name == 'pull_request'
        run: uv run python -m sinustdd.dogfood_gate --base-ref origin/main

  test-lower-bounds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Lowest Direct Dependencies
        run: uv sync --resolution lowest-direct

      - name: Run Pytest against Lowest Bounds
        run: uv run pytest -v
